<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>農業管理システム | 作業履歴</title>
    <link rel="stylesheet" th:href="@{/css/style.css(v='20260922-1')}">
    
    <link rel="stylesheet" th:href="@{/css/calendar-dashboard.css(v='20260922-1')}">
    <link rel="stylesheet" th:href="@{/css/operations.css(v='20260922-1')}">
    <script defer th:src="@{/js/script.js(v='20260925-3')}"></script>
<link rel="stylesheet" th:href="@{/css/professional-ui.css(v='20260922-1')}">
    <link rel="stylesheet" th:href="@{/css/discord-theme.css(v='20260922-1')}" href="/css/discord-theme.css?v=20260922-1">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <link rel="stylesheet" th:href="@{/css/auth.css(v='20260927-green-icon-2')}" href="/css/auth.css?v=20260927-green-icon-2">
    <meta name="theme-color" content="#1B5E20">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="農業管理">
    <link rel="manifest" th:href="@{/manifest.json(v='20260927-install-fix-1')}" href="/manifest.json?v=20260927-install-fix-1">
    <link rel="apple-touch-icon" sizes="180x180" th:href="@{/icons/apple-touch-icon-180.png}" href="/icons/apple-touch-icon-180.png">
    <link rel="icon" type="image/png" sizes="32x32" th:href="@{/icons/favicon-32.png}" href="/icons/favicon-32.png">
    <script defer th:src="@{/js/pwa.js(v='20260927-install-fix-1')}" src="/js/pwa.js?v=20260927-install-fix-1"></script>
</head>
<body class="dashboard-body calendar-screen operations-screen" th:classappend="|theme-${uiTheme} layout-${layoutMode}|">
<div th:replace="~{fragments/auth :: accountBar}"></div>
<button id="menuBtn" class="menu-btn" type="button" aria-label="メニューを開閉" aria-controls="mainSidebar" aria-expanded="false">☰</button>
<div class="app-layout">
    <aside th:replace="~{fragments/operations-sidebar :: sidebar('history')}"></aside>
    <main class="main-content">
        <div class="operations-page">
            <header class="operations-heading">
                <div><h1>作業履歴</h1><p>登録した作業の実施状況を確認し、進捗を更新できます。</p></div>
                <a class="operation-button primary" th:href="@{/calendar}">＋ 作業を登録</a>
            <a class="operation-button" th:href="@{/calendar}">閉じる</a>
            </header>
            <p class="history-notice" role="status" th:if="${message != null}" th:text="${message}"></p>
            <p class="history-error" role="alert" th:if="${error != null and editWork == null}" th:text="${error}"></p>
            <section class="report-card-grid" aria-label="作業履歴集計">
                <article class="report-card"><span>登録作業数</span><strong th:text="${totalCount}">0</strong></article>
                <article class="report-card"><span>完了</span><strong th:text="${completedCount}">0</strong></article>
            </section>
            <section class="operations-panel">
                <h2>作業一覧</h2>
                <div class="operations-table-wrap">
                    <table class="operations-table">
                        <thead><tr><th>日付</th><th>時間</th><th>作業</th><th>担当者</th><th>圃場</th><th>作物</th><th>進捗</th><th>操作</th></tr></thead>
                        <tbody>
                        <tr th:each="schedule : ${schedules}">
                            <td th:text="${schedule.date}">2026-09-08</td>
                            <td th:text="${schedule.startTime + '～' + schedule.endTime}">08:00～10:00</td>
                            <td><strong th:text="${#strings.isEmpty(schedule.workType) ? schedule.schedule : schedule.workType}">除草</strong><br><small th:text="${schedule.schedule}"></small></td>
                            <td th:text="${#strings.isEmpty(schedule.userName) ? '未設定' : schedule.userName}">担当者</td>
                            <td th:text="${#strings.isEmpty(schedule.fieldName) ? '未設定' : schedule.fieldName}">圃場</td>
                            <td th:text="${#strings.isEmpty(schedule.cropName) ? '未設定' : schedule.cropName}">作物</td>
                            <td>
                                <form class="inline-status" th:action="@{/work-history/status/{id}(id=${schedule.id})}" method="post">
                                    <select name="status" aria-label="進捗状態">
                                        <option value="未着手" th:selected="${schedule.status == null or schedule.status == '未着手'}">未着手</option>
                                        <option value="進行中" th:selected="${schedule.status == '進行中'}">進行中</option>
                                        <option value="完了" th:selected="${schedule.status == '完了'}">完了</option>
                                    </select>
                                    
                                </form>
                            </td>
                            <td><div class="operations-actions history-row-actions">
                                <a class="operation-button primary" th:href="@{/work-history/edit/{id}(id=${schedule.id})}">編集</a>
                                <form th:action="@{/work-history/delete/{id}(id=${schedule.id})}" method="post" onsubmit="return confirm('この作業を消去しますか？カレンダーからも削除されます。');">
                                    <button class="operation-button danger" type="submit">消去</button>
                                </form>
                            </div></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
                <p class="operations-empty" th:if="${#lists.isEmpty(schedules)}">作業履歴はまだありません。</p>
            </section>
        </div>
    </main>
</div>

<div class="history-overlay" th:if="${editWork != null}">
    <section class="history-editor operations-panel" role="dialog" aria-modal="true" aria-labelledby="history-edit-title">
        <h2 id="history-edit-title">作業履歴を編集</h2>
        <p class="history-error" role="alert" th:if="${error != null}" th:text="${error}"></p>
        <form id="historyEditForm" th:action="@{/work-history/update/{id}(id=${editWork.id})}" method="post">
            <div class="operations-form-grid">
                <div><label for="history-date">日付（必須）</label>
                    <input id="history-date" type="date" name="date" th:value="${editWork.date}" required>
                </div>
                <div><label for="history-startTime">開始時間（必須）</label>
                    <input id="history-startTime" type="time" name="startTime" th:value="${editWork.startTime}" required step="1">
                </div>
                <div><label for="history-endTime">終了時間（必須）</label>
                    <input id="history-endTime" type="time" name="endTime" th:value="${editWork.endTime}" required step="1">
                </div>
                <div><label for="history-userName">担当者（必須）</label>
                    <input id="history-userName" type="text" name="userName" th:value="${editWork.userName}" required maxlength="50">
                </div>
                <div><label for="history-schedule">作業内容（必須）</label>
                    <textarea id="history-schedule" name="schedule" rows="3" th:text="${editWork.schedule}" required maxlength="500"></textarea>
                </div>
                <div><label for="history-fieldName">圃場名</label>
                    <input id="history-fieldName" type="text" name="fieldName" th:value="${editWork.fieldName}" maxlength="100">
                </div>
                <div><label for="history-cropName">作物</label>
                    <input id="history-cropName" type="text" name="cropName" th:value="${editWork.cropName}" maxlength="100">
                </div>
                <div><label for="history-workType">作業種類</label>
                    <input id="history-workType" type="text" name="workType" th:value="${editWork.workType}" maxlength="100">
                </div>
                <div><label for="history-status">進捗状態（必須）</label>
                    <select id="history-status" name="status" required>
                        <option value="未着手" th:selected="${editWork.status == '未着手' or editWork.status == null}">未着手</option>
                        <option value="進行中" th:selected="${editWork.status == '進行中'}">進行中</option>
                        <option value="完了" th:selected="${editWork.status == '完了'}">完了</option>
                    </select>
                </div>
                <div><label for="history-memo">メモ</label>
                    <textarea id="history-memo" name="memo" rows="3" th:text="${editWork.memo}" maxlength="1000"></textarea>
                </div>
            </div>
        </form>
        <div class="operations-actions history-editor-actions">
            <button class="operation-button primary" type="submit" form="historyEditForm">更新</button>
            <form th:action="@{/work-history/delete/{id}(id=${editWork.id})}" method="post" onsubmit="return confirm('この作業を消去しますか？カレンダーからも削除されます。');">
                <button class="operation-button danger" type="submit">消去</button>
            </form>
            <a class="operation-button" th:href="@{/work-history}">閉じる</a>
        </div>
    </section>
</div>
</body></html>
