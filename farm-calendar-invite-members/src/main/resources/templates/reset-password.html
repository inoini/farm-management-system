<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>パスワード再設定 | 農業管理システム</title>
    <link rel="stylesheet" th:href="@{/css/auth.css(v='20260927-green-icon-2')}" href="/css/auth.css?v=20260927-green-icon-2">
    <meta name="theme-color" content="#1B5E20">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="農業管理">
    <link rel="manifest" th:href="@{/manifest.json(v='20260927-install-fix-1')}" href="/manifest.json?v=20260927-install-fix-1">
    <link rel="apple-touch-icon" sizes="180x180" th:href="@{/icons/apple-touch-icon-180.png}" href="/icons/apple-touch-icon-180.png">
    <link rel="icon" type="image/png" sizes="32x32" th:href="@{/icons/favicon-32.png}" href="/icons/favicon-32.png">
    <script defer th:src="@{/js/pwa.js(v='20260927-install-fix-1')}" src="/js/pwa.js?v=20260927-install-fix-1"></script>
</head>
<body class="login-page">
<main class="login-card">
    <div class="login-mark" aria-hidden="true">🌱</div>
    <h1>新しいパスワードを設定</h1>
    <p class="login-message error" role="alert" th:if="${errorMessage}" th:text="${errorMessage}"></p>
    <form th:if="${tokenValid}" th:action="@{/reset-password}" method="post">
        <input type="hidden" name="token" th:value="${token}">
        <label for="password">新しいパスワード</label>
        <input id="password" name="password" type="password" minlength="8" maxlength="64" autocomplete="new-password" required autofocus>
        <p class="field-help">8～64文字で入力してください。</p>
        <label for="passwordConfirm">新しいパスワード（確認）</label>
        <input id="passwordConfirm" name="passwordConfirm" type="password" minlength="8" maxlength="64" autocomplete="new-password" required>
        <button class="login-submit" type="submit">パスワードを変更</button>
    </form>
    <div class="auth-switch">
        <a th:if="${!tokenValid}" th:href="@{/forgot-password}" href="/forgot-password">再設定メールをもう一度送る</a>
        <a th:href="@{/login}" href="/login">ログインへ戻る</a>
    </div>
</main>
</body>
</html>
