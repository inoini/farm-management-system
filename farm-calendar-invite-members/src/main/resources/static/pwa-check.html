<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PWA診断</title>
<link rel="manifest" href="/manifest.json?v=20260927-android-install-2">
<meta name="theme-color" content="#138f38">
<style>body{font-family:system-ui,sans-serif;max-width:720px;margin:24px auto;padding:0 16px}li{margin:12px 0;padding:10px;border-radius:8px;background:#f2f5f2}.ok{color:#176b2d}.ng{color:#a22}button{padding:10px 14px}</style>
</head>
<body>
<h1>PWAインストール診断</h1>
<ul id="results"><li>確認中...</li></ul>
<button id="reload" type="button">再確認</button>
<script>
(async()=>{const out=document.getElementById('results');const rows=[];const add=(n,ok,d)=>rows.push(`<li class="${ok?'ok':'ng'}">${ok?'✓':'✗'} ${n}${d?'：'+d:''}</li>`);
add('HTTPS',location.protocol==='https:'||location.hostname==='localhost',location.protocol);
try{const r=await fetch('/manifest.json?v=20260927-android-install-2',{cache:'no-store'});const m=await r.json();add('manifest.json',r.ok,`${r.status} / ${m.name||''}`);try{const sr=await fetch(m.start_url||'/app-start.html',{cache:'no-store',redirect:'follow'});add('start_url',sr.ok,`${sr.status} / ${m.start_url||''}`)}catch(e){add('start_url',false,e.message)}add('192pxアイコン',!!m.icons?.some(i=>i.sizes==='192x192'&&String(i.purpose||'any').includes('any')));add('512pxアイコン',!!m.icons?.some(i=>i.sizes==='512x512'&&String(i.purpose||'any').includes('any')));}catch(e){add('manifest.json',false,e.message)}
if('serviceWorker'in navigator){try{const reg=await navigator.serviceWorker.register('/service-worker.js',{scope:'/'});await navigator.serviceWorker.ready;add('Service Worker',!!reg.active||!!reg.waiting||!!reg.installing,reg.scope)}catch(e){add('Service Worker',false,e.message)}}else add('Service Worker',false,'未対応');
add('standalone起動',matchMedia('(display-mode: standalone)').matches,'未インストールなら×で正常');out.innerHTML=rows.join('');})();
document.getElementById('reload').onclick=()=>location.reload();
</script>
</body></html>
