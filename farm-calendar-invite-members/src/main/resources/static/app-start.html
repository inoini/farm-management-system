<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>農業管理システム</title>
  <meta name="theme-color" content="#138f38">
  <link rel="manifest" href="/manifest.json?v=20260927-android-install-2">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png">
  <style>
    html,body{height:100%;margin:0;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;background:#f5f7f5;color:#173a22}
    body{display:grid;place-items:center;padding:20px;box-sizing:border-box}
    .card{width:min(420px,100%);text-align:center;background:#fff;border-radius:24px;padding:28px 22px;box-shadow:0 12px 36px rgba(0,0,0,.12)}
    img{width:112px;height:112px;border-radius:24px}h1{font-size:1.4rem;margin:14px 0 6px}.status{margin:0 0 18px;color:#53645b}.open{display:inline-block;padding:12px 20px;border-radius:999px;background:#138f38;color:#fff;text-decoration:none;font-weight:700}
  </style>
</head>
<body>
  <main class="card">
    <img src="/icons/icon-192.png" alt="">
    <h1>農業管理システム</h1>
    <p class="status" id="status">起動しています…</p>
    <a class="open" href="/" id="open" hidden>農業管理システムを開く</a>
  </main>
<script>
(function(){
  var status=document.getElementById('status');
  var open=document.getElementById('open');
  if(!navigator.onLine){
    status.textContent='現在オフラインです。通信が戻ってからもう一度お試しください。';
    open.hidden=false;
    return;
  }
  setTimeout(function(){ location.replace('/'); },250);
  setTimeout(function(){ status.textContent='自動で開かない場合は下のボタンを押してください。'; open.hidden=false; },1800);
})();
</script>
</body>
</html>
