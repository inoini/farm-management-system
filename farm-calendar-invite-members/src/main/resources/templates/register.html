<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>新規登録 | 農業管理システム</title>
    <link rel="stylesheet" th:href="@{/css/auth.css(v='20260927-green-icon-2')}" href="/css/auth.css?v=20260927-green-icon-2">
    <meta name="theme-color" content="#1B5E20">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="農業管理">
    <link rel="manifest" th:href="@{/manifest.json}" href="/manifest.json">
    <link rel="apple-touch-icon" sizes="180x180" th:href="@{/icons/apple-touch-icon-180.png}" href="/icons/apple-touch-icon-180.png">
    <link rel="icon" type="image/png" sizes="32x32" th:href="@{/icons/favicon-32.png}" href="/icons/favicon-32.png">
    <script defer th:src="@{/js/pwa.js(v='20260927-green-icon-2')}" src="/js/pwa.js?v=20260927-green-icon-2"></script>
</head>
<body class="login-page">
<main class="login-card">
    <div class="login-mark" aria-hidden="true">🌱</div>
    <h1>新しい農場を作成</h1>
    <p class="login-intro">最初の登録者が農場の管理者になります。あとから招待コードを発行し、家族や従業員を同じ農場へ追加できます。</p>
    <p class="login-message error" role="alert" th:if="${errorMessage}" th:text="${errorMessage}">入力内容を確認してください。</p>
    <form th:action="@{/register}" method="post">
        <label for="farmName">農場名</label>
        <input id="farmName" name="farmName" type="text" maxlength="100" autocomplete="organization"
               th:value="${farmName}" required>

        <label for="displayName">あなたの表示名</label>
        <input id="displayName" name="displayName" type="text" maxlength="50" autocomplete="name"
               th:value="${displayName}" required>

        <label for="username">あなたのユーザー名</label>
        <input id="username" name="username" type="text" minlength="3" maxlength="40" autocomplete="username"
               autocapitalize="none" spellcheck="false" th:value="${username}" required>
        <p class="field-help">3～40文字。メンバーごとに別のユーザー名を使用します。</p>

        <label for="email">あなたのメールアドレス</label>
        <input id="email" name="email" type="email" maxlength="254" autocomplete="email"
               autocapitalize="none" spellcheck="false" th:value="${email}" required>
        <p class="field-help">ユーザー名・パスワードを忘れた場合の本人確認と復旧に使用します。</p>

        <label for="password">パスワード</label>
        <input id="password" name="password" type="password" minlength="8" maxlength="64" autocomplete="new-password" required>
        <p class="field-help">8～64文字。ほかのメンバーとは共有せず、自分専用のパスワードにしてください。</p>

        <label for="passwordConfirm">パスワード（確認）</label>
        <input id="passwordConfirm" name="passwordConfirm" type="password" minlength="8" maxlength="64" autocomplete="new-password" required>
        <button class="login-submit" type="submit">農場を作成して登録</button>
    </form>
    <div class="auth-switch auth-switch-column">
        <span>すでに招待コードを持っていますか？</span>
        <a th:href="@{/join}" href="/join">招待コードで農場に参加</a>
        <a th:href="@{/login}" href="/login">ログインへ戻る</a>
    </div>
</main>
</body>
</html>
