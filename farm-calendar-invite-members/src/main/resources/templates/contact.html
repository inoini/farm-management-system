<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>お問い合わせ | 農業管理システム</title>
    <link rel="stylesheet" th:href="@{/css/style.css(v='20260922-1')}">
    <link rel="stylesheet" th:href="@{/css/calendar-dashboard.css(v='20260922-1')}">
    <link rel="stylesheet" th:href="@{/css/operations.css(v='20260922-1')}">
    <link rel="stylesheet" th:href="@{/css/professional-ui.css(v='20260922-1')}">
    <link rel="stylesheet" th:href="@{/css/discord-theme.css(v='20260922-1')}">
    <link rel="stylesheet" th:href="@{/css/auth.css(v='20260927-green-icon-2')}">
    <script defer th:src="@{/js/script.js(v='20260925-3')}"></script>
    <style>
        .contact-form { display: grid; gap: 18px; max-width: 820px; }
        .contact-field { display: grid; gap: 7px; }
        .contact-field label { font-weight: 800; }
        .contact-field input, .contact-field textarea {
            width: 100%; padding: 12px 13px; border: 1px solid #b8c7bb; border-radius: 9px;
            background: var(--discord-surface, #fff); color: var(--discord-text, #263229); font: inherit;
        }
        .contact-field textarea { min-height: 220px; resize: vertical; line-height: 1.65; }
        .contact-account { padding: 13px 15px; border-radius: 9px; background: var(--discord-surface-raised, #f4f7f4); }
        .contact-account p { margin: 4px 0; overflow-wrap: anywhere; }
        .contact-help { color: var(--discord-text-muted, #657168); font-size: 13px; line-height: 1.7; }
        .contact-submit { min-height: 46px; padding: 10px 20px; border: 0; border-radius: 9px; background: var(--discord-accent, #286d32); color: #fff; font: inherit; font-weight: 800; cursor: pointer; }
        .contact-notice { margin-top: 10px; padding: 11px 13px; border-radius: 8px; background: #fff8e6; color: #7b5700; }
    </style>
</head>
<body class="dashboard-body calendar-screen operations-screen"
      th:classappend="|theme-${uiTheme} layout-${layoutMode}|">
<div th:replace="~{fragments/auth :: accountBar}"></div>
<button id="menuBtn" class="menu-btn" type="button" aria-label="メニューを開閉"
        aria-controls="mainSidebar" aria-expanded="false">☰</button>
<div class="app-layout">
    <aside th:replace="~{fragments/operations-sidebar :: sidebar('contact')}"></aside>
    <main class="main-content">
        <div class="operations-page">
            <header class="operations-heading">
                <div>
                    <h1>お問い合わせ</h1>
                    <p>システムの不具合・使い方・ご要望を運営者へ送信できます。</p>
                </div>
            </header>

            <div class="alert alert-success" th:if="${contactSuccess}" th:text="${contactSuccess}"></div>
            <div class="alert alert-error" th:if="${contactError}" th:text="${contactError}"></div>
            <div class="contact-notice" th:if="${contactNotice}" th:text="${contactNotice}"></div>

            <section class="operations-panel">
                <form class="contact-form" th:action="@{/contact}" method="post">
                    <div class="contact-account">
                        <p><strong>お名前：</strong><span th:text="${contactName}">利用者</span></p>
                        <p><strong>返信先メール：</strong><span th:text="${contactEmail}">user@example.com</span></p>
                    </div>
                    <div class="contact-field">
                        <label for="contact-subject">件名</label>
                        <input id="contact-subject" name="subject" type="text" maxlength="160" required
                               placeholder="例：作業カレンダーの表示について">
                    </div>
                    <div class="contact-field">
                        <label for="contact-message">お問い合わせ内容</label>
                        <textarea id="contact-message" name="message" maxlength="4000" required
                                  placeholder="状況やご要望をできるだけ具体的に入力してください。"></textarea>
                    </div>
                    <p class="contact-help">送信内容は運営者へのお問い合わせとして保存されます。返信が必要な場合は、登録済みメールアドレス宛てに連絡します。</p>
                    <button class="contact-submit" type="submit">お問い合わせを送信</button>
                </form>
            </section>
        </div>
    </main>
</div>
</body>
</html>
