<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>農業管理システム | 作業者管理</title>
    <link rel="stylesheet" th:href="@{/css/style.css(v='20260922-1')}"><link rel="stylesheet" th:href="@{/css/calendar-dashboard.css(v='20260922-1')}"><link rel="stylesheet" th:href="@{/css/operations.css(v='20260922-1')}"><script defer th:src="@{/js/script.js(v='20260925-3')}"></script>
<link rel="stylesheet" th:href="@{/css/professional-ui.css(v='20260922-1')}">
    <link rel="stylesheet" th:href="@{/css/discord-theme.css(v='20260922-1')}" href="/css/discord-theme.css?v=20260922-1">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <link rel="stylesheet" th:href="@{/css/auth.css(v='20260927-green-icon-2')}" href="/css/auth.css?v=20260927-green-icon-2">
    <meta name="theme-color" content="#1B5E20">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="農業管理">
    <link rel="manifest" th:href="@{/manifest.json(v='20260927-install-fix-1')}" href="/manifest.json?v=20260927-install-fix-1">
    <link rel="apple-touch-icon" sizes="180x180" th:href="@{/icons/apple-touch-icon-180.png}" href="/icons/apple-touch-icon-180.png">
    <link rel="icon" type="image/png" sizes="32x32" th:href="@{/icons/favicon-32.png}" href="/icons/favicon-32.png">
    <script defer th:src="@{/js/pwa.js(v='20260927-install-fix-1')}" src="/js/pwa.js?v=20260927-install-fix-1"></script>
</head>
<body class="dashboard-body calendar-screen operations-screen" th:classappend="|theme-${uiTheme} layout-${layoutMode}|">
<div th:replace="~{fragments/auth :: accountBar}"></div>
<button id="menuBtn" class="menu-btn" type="button" aria-label="メニューを開閉" aria-controls="mainSidebar" aria-expanded="false">☰</button>
<div class="app-layout"><aside th:replace="~{fragments/operations-sidebar :: sidebar('workers')}"></aside><main class="main-content"><div class="operations-page">
    <header class="operations-heading"><div><h1>作業者管理</h1><p>担当者の連絡先と在籍状況を管理します。</p></div></header>
    <div class="operations-grid">
        <section class="operations-panel"><h2 th:text="${worker.id == null ? '作業者を登録' : '作業者を編集'}">作業者を登録</h2>
            <form th:action="@{/workers/save}" th:object="${worker}" method="post"><input type="hidden" th:field="*{id}">
                <label for="name">氏名</label><input id="name" type="text" th:field="*{name}" required maxlength="80" placeholder="例：関根">
                <label for="role">役割</label><input id="role" type="text" th:field="*{role}" maxlength="80" placeholder="例：圃場責任者">
                <label for="phone">電話番号</label><input id="phone" type="tel" th:field="*{phone}" maxlength="30">
                <label for="email">メール</label><input id="email" type="email" th:field="*{email}" maxlength="120">
                <label class="operations-checkbox"><input type="checkbox" name="active" value="true" th:checked="${worker.active == null or worker.active}">在籍中</label>
                <div class="operations-actions"><button class="operation-button primary" type="submit">保存</button><a class="operation-button" th:if="${worker.id != null}" th:href="@{/workers}">キャンセル</a></div>
            </form>
        </section>
        <section class="operations-panel"><h2>作業者一覧</h2><div class="operations-table-wrap"><table class="operations-table"><thead><tr><th>氏名</th><th>役割</th><th>電話</th><th>メール</th><th>状態</th><th>操作</th></tr></thead><tbody>
            <tr th:each="item : ${workers}"><td th:text="${item.name}">氏名</td><td th:text="${item.role}">役割</td><td th:text="${item.phone}">電話</td><td th:text="${item.email}">メール</td><td><span class="status-pill" th:text="${item.active ? '在籍中' : '停止中'}">在籍中</span></td><td><div class="operations-actions"><a class="operation-button" th:href="@{/workers/edit/{id}(id=${item.id})}">編集</a><form th:action="@{/workers/delete/{id}(id=${item.id})}" method="post" onsubmit="return confirm('この作業者を削除しますか？');"><button class="operation-button danger" type="submit">削除</button></form></div></td></tr>
        </tbody></table></div><p class="operations-empty" th:if="${#lists.isEmpty(workers)}">作業者はまだ登録されていません。</p></section>
    </div>
</div></main></div>
</body></html>
