name: Farm Photo Feature Tests

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'farm-calendar-invite-members/**'
      - '.github/workflows/photo-feature-tests.yml'
  workflow_dispatch:

jobs:
  photo-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: farm-calendar-invite-members
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run photo and field profit tests
        run: mvn -B -Dtest=FarmPhotoStorageTest,FarmPhotoControllerTest,FieldProfitAggregationTest test
