<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>パスワードを忘れた | 農業管理システム</title>
    <link rel="stylesheet" th:href="@{/css/auth.css(v='20261001-recovery-2')}" href="/css/auth.css?v=20261001-recovery-2">
    <meta name="theme-color" content="#1B5E20">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="農業管理">
    <link rel="manifest" th:href="@{/manifest.json(v='20260927-install-fix-1')}" href="/manifest.json?v=20260927-install-fix-1">
    <link rel="apple-touch-icon" sizes="180x180" th:href="@{/icons/apple-touch-icon-180.png}" href="/icons/apple-touch-icon-180.png">
    <link rel="icon" type="image/png" sizes="32x32" th:href="@{/icons/favicon-32.png}" href="/icons/favicon-32.png">
    <script defer th:src="@{/js/pwa.js(v='20260927-install-fix-1')}" src="/js/pwa.js?v=20260927-install-fix-1"></script>
</head>
<body class="login-page">
<main class="login-card">
    <div class="login-mark" aria-hidden="true">🌱</div>
    <h1>パスワードを再設定</h1>
    <p class="login-intro">ユーザー名と登録メールアドレスを入力してください。両方が一致したアカウントだけに、30分有効の再設定リンクを送ります。</p>
    <p class="login-message error" role="alert" th:if="${errorMessage}" th:text="${errorMessage}"></p>
    <p class="login-message success" role="status" th:if="${successMessage}" th:text="${successMessage}"></p>
    <form th:action="@{/forgot-password}" method="post" autocomplete="off">
        <label for="username">ユーザー名</label>
        <input id="username" name="username" type="text" maxlength="40" autocomplete="off" autocapitalize="none" spellcheck="false" th:value="${username}" required autofocus>
        <p class="field-help">Gmailアドレスではなく、登録したユーザー名を入力してください。</p>

        <label for="email">登録メールアドレス</label>
        <input id="email" name="email" type="email" maxlength="254" autocomplete="email" th:value="${email}" required>

        <button class="login-submit" type="submit">再設定メールを送る</button>
    </form>

    <div class="auth-switch auth-switch-column">
        <span>ユーザー名も忘れた場合</span>
        <a th:href="@{/forgot-username}" href="/forgot-username">登録メールからユーザー名を確認</a>
        <a th:href="@{/login}" href="/login">ログインへ戻る</a>
    </div>
</main>
</body>
</html>
