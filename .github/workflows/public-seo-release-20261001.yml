name: Publish public SEO landing page

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/public-seo-release-20261001.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make public landing page and SEO files
        run: |
          python3 - <<'PY'
          from pathlib import Path

          calendar = Path('farm-calendar-invite-members/src/main/java/com/example/demo/conotroller/CalendarController.java')
          text = calendar.read_text(encoding='utf-8')
          old = '@GetMapping({"/", "/calendar"})'
          new = '@GetMapping("/calendar")'
          if old not in text:
              raise SystemExit('Calendar root mapping pattern not found')
          calendar.write_text(text.replace(old, new, 1), encoding='utf-8')

          dashboard = Path('farm-calendar-invite-members/src/main/java/com/example/demo/conotroller/DashboardController.java')
          dashboard.write_text('''package com.example.demo.conotroller;\n\nimport org.springframework.stereotype.Controller;\nimport org.springframework.web.bind.annotation.GetMapping;\n\n@Controller\npublic class DashboardController {\n\n    @GetMapping("/")\n    public String home() {\n        return "index";\n    }\n\n    // Keep old bookmarks working after retiring the dashboard.\n    @GetMapping("/dashboard")\n    public String dashboard() {\n        return "redirect:/calendar";\n    }\n}\n''', encoding='utf-8')

          security = Path('farm-calendar-invite-members/src/main/java/com/example/demo/security/SecurityConfig.java')
          text = security.read_text(encoding='utf-8')
          old = '"/login", "/register", "/join", "/forgot-username", "/forgot-password", "/reset-password",'
          new = '"/", "/robots.txt", "/sitemap.xml",\n                    "/login", "/register", "/join", "/forgot-username", "/forgot-password", "/reset-password",'
          if old not in text:
              raise SystemExit('Security public paths pattern not found')
          text = text.replace(old, new, 1)
          old_success = '.defaultSuccessUrl("/", true)'
          if old_success not in text:
              raise SystemExit('Login success pattern not found')
          text = text.replace(old_success, '.defaultSuccessUrl("/calendar", true)', 1)
          security.write_text(text, encoding='utf-8')
          PY

          cat > farm-calendar-invite-members/src/main/resources/templates/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="ja">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <title>無料の農業管理システム｜作業カレンダー・作物・圃場・売上・経費管理</title>
              <meta name="description" content="農家・農業法人向けの無料で始められる農業管理システム。作業カレンダー、作物管理、圃場管理、売上・経費・収支、収穫・出荷、在庫をスマホやパソコンからまとめて管理できます。">
              <meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1">
              <link rel="canonical" href="https://farm-management-system-ezax.onrender.com/">
              <meta property="og:type" content="website">
              <meta property="og:locale" content="ja_JP">
              <meta property="og:title" content="無料の農業管理システム｜作業・作物・圃場・経営をまとめて管理">
              <meta property="og:description" content="農作業の予定、作物・圃場、売上・経費・収支、収穫・出荷をWebで一元管理。無料で始められます。">
              <meta property="og:url" content="https://farm-management-system-ezax.onrender.com/">
              <meta property="og:site_name" content="農業管理システム">
              <meta name="theme-color" content="#1B5E20">
              <link rel="manifest" href="/manifest.json">
              <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-180.png">
              <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
              <script type="application/ld+json">
              {
                "@context": "https://schema.org",
                "@type": "WebApplication",
                "name": "農業管理システム",
                "url": "https://farm-management-system-ezax.onrender.com/",
                "applicationCategory": "BusinessApplication",
                "operatingSystem": "Web browser",
                "description": "作業カレンダー、作物、圃場、売上、経費、収支、収穫・出荷、在庫を管理できる農業向けWebアプリケーション。",
                "offers": {
                  "@type": "Offer",
                  "price": "0",
                  "priceCurrency": "JPY"
                }
              }
              </script>
              <style>
                  * { box-sizing: border-box; }
                  html { scroll-behavior: smooth; }
                  body { margin: 0; font-family: "Yu Gothic", "Meiryo", system-ui, sans-serif; color: #17351e; background: #f5f8f4; line-height: 1.7; }
                  a { color: inherit; text-decoration: none; }
                  .wrap { width: min(1120px, calc(100% - 36px)); margin: 0 auto; }
                  header { position: sticky; top: 0; z-index: 10; background: rgba(255,255,255,.94); border-bottom: 1px solid #dfe8df; backdrop-filter: blur(10px); }
                  .nav { min-height: 68px; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
                  .brand { display: flex; align-items: center; gap: 10px; font-weight: 900; color: #1b5e20; }
                  .brand-mark { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 11px; background: #e6f3e6; font-size: 22px; }
                  .nav-actions { display: flex; gap: 10px; }
                  .btn { min-height: 44px; display: inline-flex; align-items: center; justify-content: center; padding: 10px 18px; border-radius: 10px; font-weight: 800; border: 1px solid #b8c9ba; background: white; }
                  .btn.primary { color: white; background: #1f6d2b; border-color: #1f6d2b; }
                  .hero { padding: 76px 0 64px; background: linear-gradient(145deg, #f6fbf5 0%, #e8f5e8 55%, #f6faf3 100%); border-bottom: 1px solid #dfe8df; }
                  .hero-grid { display: grid; grid-template-columns: 1.15fr .85fr; gap: 48px; align-items: center; }
                  .badge { display: inline-flex; padding: 7px 11px; border-radius: 999px; background: #dff0e1; color: #23632b; font-size: 13px; font-weight: 900; }
                  h1 { margin: 16px 0 18px; font-size: clamp(34px, 5vw, 56px); line-height: 1.2; letter-spacing: -.03em; color: #184d21; }
                  .lead { margin: 0 0 26px; font-size: clamp(16px, 2vw, 19px); color: #4d6251; }
                  .hero-actions { display: flex; flex-wrap: wrap; gap: 12px; }
                  .note { margin-top: 13px; color: #657568; font-size: 13px; }
                  .preview { padding: 24px; border-radius: 22px; background: #234c2a; color: white; box-shadow: 0 24px 60px rgba(30,78,39,.2); }
                  .preview h2 { margin: 0 0 14px; font-size: 21px; }
                  .preview-list { display: grid; gap: 10px; }
                  .preview-item { display: flex; align-items: center; gap: 12px; padding: 13px 14px; border-radius: 12px; background: rgba(255,255,255,.1); }
                  .preview-item b { display: block; }
                  .preview-item span { display: block; color: #dbe9dc; font-size: 12px; }
                  section { padding: 66px 0; }
                  .section-head { max-width: 760px; margin: 0 auto 30px; text-align: center; }
                  .section-head h2 { margin: 0 0 10px; font-size: clamp(27px, 4vw, 38px); color: #1b5223; }
                  .section-head p { margin: 0; color: #617064; }
                  .features { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
                  .card { padding: 24px; border: 1px solid #dbe5dc; border-radius: 16px; background: white; box-shadow: 0 8px 24px rgba(39,77,44,.06); }
                  .card-icon { font-size: 27px; }
                  .card h3 { margin: 10px 0 7px; font-size: 19px; }
                  .card p { margin: 0; color: #647167; font-size: 14px; }
                  .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; counter-reset: step; }
                  .step { position: relative; padding: 25px; border-radius: 16px; background: #eaf4e9; }
                  .step::before { counter-increment: step; content: counter(step); width: 34px; height: 34px; display: grid; place-items: center; margin-bottom: 12px; border-radius: 50%; background: #256b30; color: white; font-weight: 900; }
                  .step h3 { margin: 0 0 6px; }
                  .step p { margin: 0; color: #5c6e60; font-size: 14px; }
                  .cta { padding: 34px; display: flex; align-items: center; justify-content: space-between; gap: 24px; border-radius: 20px; background: #1e5f28; color: white; }
                  .cta h2 { margin: 0 0 5px; }
                  .cta p { margin: 0; color: #dcebdc; }
                  .cta .btn { flex-shrink: 0; background: white; color: #1d5f27; border-color: white; }
                  footer { padding: 28px 0 42px; color: #68756b; font-size: 13px; }
                  .footer-row { display: flex; justify-content: space-between; gap: 16px; border-top: 1px solid #dde6de; padding-top: 24px; }
                  @media (max-width: 820px) { .hero-grid, .features, .steps { grid-template-columns: 1fr; } .hero { padding-top: 48px; } .preview { max-width: 600px; } }
                  @media (max-width: 560px) { .wrap { width: min(100% - 24px, 1120px); } .nav { align-items: flex-start; padding: 12px 0; flex-direction: column; } .nav-actions { width: 100%; } .nav-actions .btn { flex: 1; } .hero { padding: 40px 0 46px; } .cta, .footer-row { align-items: stretch; flex-direction: column; } .cta .btn { width: 100%; } section { padding: 48px 0; } }
              </style>
          </head>
          <body>
          <header>
              <div class="wrap nav">
                  <a class="brand" href="/" aria-label="農業管理システム トップ"><span class="brand-mark">🌱</span><span>農業管理システム</span></a>
                  <nav class="nav-actions" aria-label="アカウント">
                      <a class="btn" href="/login">ログイン</a>
                      <a class="btn primary" href="/register">無料で始める</a>
                  </nav>
              </div>
          </header>

          <main>
              <section class="hero">
                  <div class="wrap hero-grid">
                      <div>
                          <span class="badge">農家・農業法人向け Webアプリ</span>
                          <h1>農作業と経営を、<br>ひとつの画面で管理。</h1>
                          <p class="lead">作業カレンダー、作物・圃場、売上・経費・収支、収穫・出荷、在庫をまとめて管理。パソコンでもスマホでも使える農業管理システムです。</p>
                          <div class="hero-actions">
                              <a class="btn primary" href="/register">新しい農場を無料で作成</a>
                              <a class="btn" href="#features">できることを見る</a>
                          </div>
                          <p class="note">登録後すぐに利用できます。同じ農場のメンバーは招待コードで参加できます。</p>
                      </div>
                      <aside class="preview" aria-label="主な機能">
                          <h2>毎日の農業管理をシンプルに</h2>
                          <div class="preview-list">
                              <div class="preview-item"><span aria-hidden="true">📅</span><div><b>作業カレンダー</b><span>予定・担当者・作業内容を月単位で確認</span></div></div>
                              <div class="preview-item"><span aria-hidden="true">🌾</span><div><b>作物・圃場管理</b><span>栽培情報と圃場を整理して管理</span></div></div>
                              <div class="preview-item"><span aria-hidden="true">💴</span><div><b>売上・経費・収支</b><span>月別・年別の予算と実績を確認</span></div></div>
                              <div class="preview-item"><span aria-hidden="true">📱</span><div><b>スマホ対応</b><span>ホーム画面に追加してアプリのように利用</span></div></div>
                          </div>
                      </aside>
                  </div>
              </section>

              <section id="features">
                  <div class="wrap">
                      <div class="section-head"><h2>農業管理に必要な情報を一元化</h2><p>紙や複数の表に分かれやすい情報を、ひとつのWebシステムで確認できます。</p></div>
                      <div class="features">
                          <article class="card"><div class="card-icon">📅</div><h3>作業カレンダー</h3><p>日付ごとの予定、時間、担当者、作物、圃場、作業内容を登録。予定の検索にも対応しています。</p></article>
                          <article class="card"><div class="card-icon">🌱</div><h3>作物管理</h3><p>作物の登録・編集・管理に対応。栽培計画や収穫に関する情報をまとめて確認できます。</p></article>
                          <article class="card"><div class="card-icon">🗺️</div><h3>圃場管理</h3><p>圃場情報を一覧で管理し、住所や地図情報とあわせて確認できます。</p></article>
                          <article class="card"><div class="card-icon">💰</div><h3>売上・経費・収支</h3><p>売上と経費を記録し、利益を確認。月別の予算と実績は西暦ごとに切り替えて管理できます。</p></article>
                          <article class="card"><div class="card-icon">📦</div><h3>収穫・出荷・在庫</h3><p>収穫量や出荷の記録、資材などの在庫情報をまとめて管理できます。</p></article>
                          <article class="card"><div class="card-icon">👥</div><h3>農場メンバー共有</h3><p>農場ごとにデータを分離。同じ農場のメンバーは招待コードで参加して情報を共有できます。</p></article>
                      </div>
                  </div>
              </section>

              <section>
                  <div class="wrap">
                      <div class="section-head"><h2>始め方は3ステップ</h2><p>インストール作業は不要です。ブラウザから登録して利用できます。</p></div>
                      <div class="steps">
                          <div class="step"><h3>無料登録</h3><p>表示名、農場名、ユーザー名、メールアドレス、パスワードを登録します。</p></div>
                          <div class="step"><h3>農場データを登録</h3><p>作物、圃場、予定、売上や経費など、必要な項目から使い始めます。</p></div>
                          <div class="step"><h3>必要ならメンバー招待</h3><p>招待コードを使えば、同じ農場のメンバーとデータを共有できます。</p></div>
                      </div>
                  </div>
              </section>

              <section>
                  <div class="wrap cta">
                      <div><h2>農業管理を今日からWebで。</h2><p>まずは自分の農場を作成して、必要な機能からお試しください。</p></div>
                      <a class="btn" href="/register">無料で始める</a>
                  </div>
              </section>
          </main>

          <footer>
              <div class="wrap footer-row"><span>© 2026 農業管理システム</span><span>Web版 / スマホ対応</span></div>
          </footer>
          </body>
          </html>
          HTML

          cat > farm-calendar-invite-members/src/main/resources/static/robots.txt <<'EOF'
          User-agent: *
          Allow: /
          Disallow: /calendar
          Disallow: /management
          Disallow: /crop
          Disallow: /field
          Disallow: /operations
          Disallow: /stock
          Disallow: /sales
          Disallow: /expenses
          Disallow: /contact
          Sitemap: https://farm-management-system-ezax.onrender.com/sitemap.xml
          EOF

          cat > farm-calendar-invite-members/src/main/resources/static/sitemap.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
            <url>
              <loc>https://farm-management-system-ezax.onrender.com/</loc>
              <lastmod>2026-10-01</lastmod>
              <changefreq>weekly</changefreq>
              <priority>1.0</priority>
            </url>
          </urlset>
          EOF

      - name: Commit release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/public-seo-release-20261001.yml
          git add -A
          git commit -m "Add public searchable landing page"
          git push origin HEAD:main
