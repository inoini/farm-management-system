name: Excel export tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'farm-calendar-invite-members/**'
      - '.github/workflows/inventory-excel-feature-tests.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: farm-calendar-invite-members
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify Excel exports
        run: mvn -B -Dtest=FarmExcelExportServiceTest test
